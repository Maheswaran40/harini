<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="container py-5">
        <div class="auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus auth-icon"></i>
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-secondary">Register for ShopEasy</p>
            </div>

            <div id="signupMessage"></div>

            <form id="signupForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" minlength="3" required>
                    <div class="invalid-feedback">Username must contain at least 3 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" minlength="6" required>
                    <div class="invalid-feedback">Password must contain at least 6 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <div class="invalid-feedback">Passwords must match.</div>
                </div>

                <button class="btn btn-primary w-100" type="submit">Signup</button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
