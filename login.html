<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="container py-5">
        <div class="auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-bag-heart auth-icon"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary">Login to continue shopping</p>
            </div>

            <div id="loginMessage"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="useremail" class="form-label">Email</label>
                    <input type="email" id="useremail" class="form-control" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="userpass" class="form-label">Password</label>
                    <input type="password" id="userpass" class="form-control" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a href="signup.html">Create account</a>
            </p>
            <p class="text-center mt-2 mb-0">
                <a href="index.html" class="text-decoration-none">← Back to welcome</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
